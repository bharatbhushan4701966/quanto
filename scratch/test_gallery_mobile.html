<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Mobile Test</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Instrument Sans', sans-serif; background: #fff; }

        /* Fake header */
        .fake-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid #eee;
        }
        .fake-logo { font-weight: 700; font-size: 20px; color: #111; }
        .fake-menu { width: 36px; height: 36px; border: 1px solid #ddd; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
        .fake-menu span { width: 18px; height: 2px; background: #111; }

        .dummy-section { padding: 40px 20px; text-align: center; }
        .dummy-section h1 { font-size: 32px; margin-bottom: 12px; }

        /* Gallery Container Mobile Styles */
        @media (max-width: 768px) {
            .elementor-element-377f540 {
                padding: 20px 16px !important;
                width: 100% !important;
            }

            .elementor-element-205e781 {
                display: flex !important;
                flex-direction: column !important;
                gap: 24px !important;
                width: 100% !important;
            }

            .gallery-item {
                width: 100% !important;
                margin-bottom: 24px !important;
                overflow: hidden !important;
                border-radius: 14px !important;
                box-shadow: 0 4px 20px rgba(0,0,0,0.06);
                background: #f8f8f8;
            }

            .gallery-item:last-child {
                margin-bottom: 0 !important;
            }

            .gallery-item .elementor-widget-image {
                width: 100% !important;
                height: 380px !important;
                overflow: hidden !important;
                position: relative !important;
            }

            .gallery-item img {
                width: 100% !important;
                height: 100% !important;
                object-fit: cover !important;
                display: block !important;
                will-change: transform;
            }
        }
    </style>
</head>
<body>
    <div class="fake-header">
        <div class="fake-logo">CMR</div>
        <div class="fake-menu"><span></span><span></span></div>
    </div>

    <div class="dummy-section">
        <h1>Life at CMR</h1>
        <p>Explore opportunities and growth with our team.</p>
    </div>

    <!-- Gallery Section -->
    <div class="elementor-element elementor-element-377f540" data-id="377f540">
        <div class="elementor-element-205e781" data-id="205e781">
            <div class="gallery-item elementor-element-c5b5271" data-id="c5b5271">
                <div class="elementor-widget-image elementor-element-c12b6fb" data-id="c12b6fb">
                    <img src="https://qai8358l95-staging.onrocket.site/wp-content/uploads/2026/06/career-gallery-1.png" alt="Gallery 1">
                </div>
            </div>
            <div class="gallery-item elementor-element-42abd66" data-id="42abd66">
                <div class="elementor-widget-image elementor-element-3da0a58" data-id="3da0a58">
                    <img src="https://qai8358l95-staging.onrocket.site/wp-content/uploads/2026/06/about3-928x1024.png" alt="Gallery 2">
                </div>
            </div>
            <div class="gallery-item elementor-element-74e5f73" data-id="74e5f73">
                <div class="elementor-widget-image elementor-element-bfa0f12" data-id="bfa0f12">
                    <img src="https://qai8358l95-staging.onrocket.site/wp-content/uploads/2026/04/about-thumb-2-3.png" alt="Gallery 3">
                </div>
            </div>
            <div class="gallery-item elementor-element-39b7ec2" data-id="39b7ec2">
                <div class="elementor-widget-image elementor-element-ab4fe2a" data-id="ab4fe2a">
                    <img src="https://qai8358l95-staging.onrocket.site/wp-content/uploads/2026/04/about-thumb-2-2.png" alt="Gallery 4">
                </div>
            </div>
        </div>
    </div>

    <div class="dummy-section" style="padding: 100px 20px;">
        <h2>Open Positions</h2>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        function initMobileGalleryParallax() {
            if (window.innerWidth > 768) return;
            var items = document.querySelectorAll('.gallery-item .elementor-widget-image');
            items.forEach(function(item) {
                var img = item.querySelector('img');
                if (!img) return;
                gsap.fromTo(img, 
                    { y: -35, scale: 1.12 },
                    {
                        y: 35,
                        scale: 1.12,
                        ease: "none",
                        scrollTrigger: {
                            trigger: item,
                            start: "top bottom",
                            end: "bottom top",
                            scrub: true
                        }
                    }
                );
            });
        }
        initMobileGalleryParallax();
    </script>
</body>
</html>
