name: Scheduled Component CSS Pre-Warmer

on:
  schedule:
    # Runs every 3 hours (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    # 00:00 UTC = 5:30 AM IST, 03:00 UTC = 8:30 AM IST, 21:00 UTC = 2:30 AM IST
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  prewarm:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Headless Browser Pre-Warmer
        run: node scripts/prewarm_urls.js
